{% extends 'base.html' %}{% block content %}
<h1>HR Dashboard</h1>
<div class="row g-3">
  <div class="col-md-4">
    <div class="card p-4">
      Active employees
      <h2>{{ total }}</h2>
    </div>
  </div>
  <div class="col-md-4">
    <div class="card p-4">
      Departments
      <h2>{{ departments }}</h2>
    </div>
  </div>
  <div class="col-md-4">
    <div class="card p-4">
      Pending leave
      <h2>{{ pending }}</h2>
    </div>
  </div>
</div>
<a class="btn btn-primary mt-4" href="{% url 'report' %}"
  >Download employee CSV</a
>{% endblock %}
